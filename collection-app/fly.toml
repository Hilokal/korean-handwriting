# fly launch --no-deploy  (then adjust the app name)
app = "handwriting-collection"
# Workers are in Korea: Tokyo is the closest Fly region (no Korea region).
primary_region = "nrt"

[build]

[env]
  DATABASE_PATH = "/data/collection.db"
  PORT = "8080"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# SQLite: never scale beyond one machine.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
